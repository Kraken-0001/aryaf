<title>أرياف</title>
<style>
  /* Layout: logo + green title, sticky pill tabs on top, then cards. Summary uses label/value rows like a ledger. */
  :root {
    --bg: #f3f4f8; --surface: #ffffff; --fg: #1d2030; --muted: #666b80; --line: #e2e4ec;
    --brand: #714b67; --brand-fg: #ffffff; --soft: #f1ecf0; --hero: #714b67; --accent: #714b67;
    --good: #1a8a5a; --bad: #d23b3b; --earth: #017e84; --gold: #f0a030; --blue: #2f6fd6; --t-green: #e3f5ec; --t-blue: #e4edfc; --t-orange: #fdf0dc; --t-red: #fbe7e7; --warnbg: #fbefd2; --warnfg: #7a4d00;
    --font: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Noto Sans Arabic", system-ui, -apple-system, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15161d; --surface: #1e202a; --fg: #eceef6; --muted: #a2a6ba; --line: #323546;
      --brand: #9a6a8c; --brand-fg: #ffffff; --soft: #2a2733; --hero: #5d3d55; --accent: #d9a8cb;
      --good: #4fd09a; --bad: #f58a8a; --earth: #3fb7bd; --gold: #f2b552; --blue: #7aa6f2; --t-green: #163a2b; --t-blue: #1a2b4d; --t-orange: #44321a; --t-red: #482224; --warnbg: #3a2f12; --warnfg: #f1cf84; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15161d; --surface: #1e202a; --fg: #eceef6; --muted: #a2a6ba; --line: #323546;
    --brand: #9a6a8c; --brand-fg: #ffffff; --soft: #2a2733; --hero: #5d3d55; --accent: #d9a8cb;
    --good: #4fd09a; --bad: #f58a8a; --earth: #3fb7bd; --gold: #f2b552; --blue: #7aa6f2; --t-green: #163a2b; --t-blue: #1a2b4d; --t-orange: #44321a; --t-red: #482224; --warnbg: #3a2f12; --warnfg: #f1cf84; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.5;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }

  .brand { max-width: 640px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 6px; display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 52px; height: 52px; flex: none; border-radius: 14px; }
  .brand h1 { margin: 0; font-size: 34px; line-height: 1.25; font-weight: 800; color: var(--accent); }
  .brand p { margin: 0; font-size: 14px; color: var(--muted); }

  .tabs-wrap { display: none; }
  body:not([data-sec="home"]) .brand { display: none; }
  body[data-sec="home"] { --brand: #714b67; --accent: #714b67; }
  body[data-sec="stock"] { --brand: #2f6fd6; --accent: #2f6fd6; }
  body[data-sec="assets"] { --brand: #1a8a5a; --accent: #1a8a5a; }
  body[data-sec="expenses"] { --brand: #d23b3b; --accent: #d23b3b; }
  body[data-sec="summary"] { --brand: #714b67; --accent: #714b67; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body[data-sec="stock"] { --accent: #7aa6f2; }
    :root:not([data-theme="light"]) body[data-sec="assets"] { --accent: #4fd09a; }
    :root:not([data-theme="light"]) body[data-sec="expenses"] { --accent: #f58a8a; }
    :root:not([data-theme="light"]) body[data-sec="summary"], :root:not([data-theme="light"]) body[data-sec="home"] { --accent: #d9a8cb; }
  }
  :root[data-theme="dark"] body[data-sec="stock"] { --accent: #7aa6f2; }
  :root[data-theme="dark"] body[data-sec="assets"] { --accent: #4fd09a; }
  :root[data-theme="dark"] body[data-sec="expenses"] { --accent: #f58a8a; }
  :root[data-theme="dark"] body[data-sec="summary"], :root[data-theme="dark"] body[data-sec="home"] { --accent: #d9a8cb; }
  .secbar { position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 5; margin-top: env(safe-area-inset-top, 0px); display: flex; align-items: center; gap: 12px; background: var(--brand); color: #fff; border-radius: 18px; padding: 8px 10px; }
  .secbar h2 { margin: 0; font-size: 22px; color: #fff; }
  .secbar button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: rgba(255,255,255,.22); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
  .homegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 6px; }
  .hometile { min-height: 168px; border-radius: 24px; border: 0; padding: 16px; display: grid; align-content: space-between; justify-items: start; text-align: start; color: #fff; cursor: pointer; background: var(--tc); min-width: 0; }
  .hometile[data-sec="stock"] { --tc: #2f6fd6; } .hometile[data-sec="assets"] { --tc: #1a8a5a; }
  .hometile[data-sec="expenses"] { --tc: #d23b3b; } .hometile[data-sec="summary"] { --tc: #714b67; }
  .hometile .ic svg { width: 40px; height: 40px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .hometile b { font-size: 24px; line-height: 1.2; } .hometile .tv { font-size: 15px; opacity: .95; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  body[data-sec="sales"] { --brand: #e07b12; --accent: #c4620a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-sec="sales"] { --accent: #f2b552; } }
  :root[data-theme="dark"] body[data-sec="sales"] { --accent: #f2b552; }
  .hometile[data-sec="sales"] { --tc: #e07b12; }
  .hometile[data-sec="mats"] { --tc: #017e84; }
  body[data-sec="mats"] { --brand: #017e84; --accent: #017e84; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-sec="mats"] { --accent: #3fb7bd; } }
  :root[data-theme="dark"] body[data-sec="mats"] { --accent: #3fb7bd; }
  .cashrow { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .cashrow input { width: 110px; text-align: center; }
  .cashbox { min-width: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: transparent; }
  .en { direction: ltr; unicode-bidi: isolate; display: inline-block; letter-spacing: .04em; font-weight: 600; }
  .mini { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  select { width: 100%; min-height: 52px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 17px; }
  .sale .line { border-bottom: 0; padding-bottom: 0; } .sale { border-bottom: 1px solid var(--line); padding-bottom: 10px; } .sale:last-child { border-bottom: 0; }
  .warnbk { border: 1.5px solid #c62f2f; }
  .warnbk b { color: #c62f2f; }
  details.faq { border-top: 1px solid var(--line, #e3e8e1); padding: 10px 0; }
  details.faq summary { font-weight: 700; cursor: pointer; }
  details.faq p { margin-top: 6px; }
  .note.center { text-align: center; margin-top: 14px; }
  .tabs-wrap-old { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; }
  nav.tabs { max-width: 640px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  nav.tabs button { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 16px; cursor: pointer; padding: 0 4px; }
  nav.tabs button[aria-current="page"] { background: var(--brand); color: var(--brand-fg); border-color: transparent; }

  main { max-width: 640px; margin: 0 auto; padding: 6px 16px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
  h2 { margin: 0; font-size: 20px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .note { font-size: 14px; color: var(--muted); margin: 0; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
  .hero { background: var(--hero); border-color: transparent; text-align: center; padding: 22px 14px; gap: 4px; }
  .hero .lbl { font-size: 16px; }
  .hero .big { font-size: 44px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .line:last-child { border-bottom: 0; padding-bottom: 0; }
  .line > span:first-child { min-width: 0; }
  .line .val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 18px; }
  .val.good { color: var(--good); } .val.bad { color: var(--bad); }
  .line input[type="text"] { width: 150px; text-align: center; }
  .line small { display: block; color: var(--muted); font-size: 13px; }

  input[type="text"] { width: 100%; min-width: 0; min-height: 52px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 17px; font-variant-numeric: tabular-nums; }
  input::placeholder { color: var(--muted); opacity: .75; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .field { display: grid; gap: 5px; min-width: 0; }
  .field > label { font-size: 14px; color: var(--muted); font-weight: 600; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .addrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }
  .stepper input { text-align: center; font-size: 22px; font-weight: 700; }
  .step { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--soft); font-size: 28px; font-weight: 700; cursor: pointer; line-height: 1; }
  .btn { min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0; background: var(--brand); color: var(--brand-fg); font-weight: 700; font-size: 17px; cursor: pointer; }
  .btn.alt { background: var(--soft); color: var(--fg); border: 1px solid var(--line); }
  .btn.danger { background: var(--bad); color: var(--bg); }
  .btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-weight: 600; cursor: pointer; }

  .badge { display: inline-flex; padding: 6px 12px; border-radius: 999px; background: var(--soft); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .badge.good { color: var(--good); } .badge.bad { color: var(--bad); }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .meta small { color: var(--muted); font-size: 14px; }
  .del-row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .del-row .ask { margin-inline-end: auto; color: var(--muted); font-size: 15px; }
  .empty { text-align: center; color: var(--muted); padding: 18px 8px; }
  .warn { border: 1px solid var(--bad); border-radius: 12px; padding: 10px 12px; color: var(--bad); font-size: 15px; }
  .rowitem { display: grid; grid-template-columns: 1fr 130px; gap: 8px; }
  .rowitem + .del-row { margin-top: -2px; }

  .split { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--line); margin-top: 10px; }
  .split i { display: block; height: 100%; }
  .legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 5px; background: var(--c); }
  .badge.low { background: var(--warnbg); color: var(--warnfg); }
  .lowline { background: var(--warnbg); color: var(--warnfg); border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 15px; }
  .jar { display: block; margin: 0 auto 6px; width: 64px; height: 64px; }
  .tag { color: var(--earth) !important; font-weight: 600; }
  .hero { border: 0; color: #fff; background: var(--brand); }
  .hero .lbl { color: rgba(255,255,255,.85); }
  .hero .big { color: #fff; }
  .hero .split { background: rgba(255,255,255,.22); }
  .hero .legend { color: rgba(255,255,255,.9); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border-radius: 16px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
  .tile small { font-size: 13px; color: var(--muted); }
  .tile b { font-size: 22px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tile.g { background: var(--t-green); } .tile.g b { color: var(--good); }
  .tile.b { background: var(--t-blue); } .tile.b b { color: var(--blue); }
  .tile.o { background: var(--t-orange); } .tile.o b { color: var(--warnfg); }
  .tile.r { background: var(--t-red); } .tile.r b { color: var(--bad); }
  .verdict { border-radius: 18px; padding: 16px; display: grid; gap: 4px; }
  .verdict b { font-size: 20px; } .verdict span { font-size: 15px; }
  .verdict.win { background: var(--t-green); color: var(--good); }
  .verdict.lose { background: var(--t-red); color: var(--bad); }
  .verdict.info { background: var(--t-blue); color: var(--blue); }
  .verdict.neutral { background: var(--soft); color: var(--muted); }
  .badge.loss { background: var(--t-red); color: var(--bad); }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 10px 0 0; }
  footer b { color: var(--accent); }
  .toast { position: fixed; z-index: 9; inset-inline: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; }

  /* ---- Aryaf natural theme ---- */
  :root { --bg: #f5f0e3; --surface: #fffcf4; --fg: #2b2a1f; --muted: #756e5a; --line: #e4dcc6; --brand: #3d5a3a; --soft: #efe8d3; --hero: #3d5a3a; --accent: #3d5a3a; --good: #3f7a3a; --bad: #b5533c; --earth: #8a5a3a; --gold: #c9a24a; --warnbg: #f8ecc9; --warnfg: #7a5a10; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #181610; --surface: #23201a; --fg: #efe9d6; --muted: #aaa38c; --line: #3a3628; --brand: #5f8458; --soft: #2d2a20; --accent: #a9c892; --good: #8fcb82; --bad: #e58a72; --earth: #d1a07c; --gold: #e0bd62; --warnbg: #3a3012; --warnfg: #f1cf84; } }
  :root[data-theme="dark"] { --bg: #181610; --surface: #23201a; --fg: #efe9d6; --muted: #aaa38c; --line: #3a3628; --brand: #5f8458; --soft: #2d2a20; --accent: #a9c892; --good: #8fcb82; --bad: #e58a72; --earth: #d1a07c; --gold: #e0bd62; --warnbg: #3a3012; --warnfg: #f1cf84; }

  .hometile[data-sec="mats"] { --tc: #3f7a6b; } .hometile[data-sec="assets"] { --tc: #8a5a3a; } .hometile[data-sec="expenses"] { --tc: #b5533c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body[data-sec="home"], :root:not([data-theme="light"]) body[data-sec="summary"] { --accent: #a9c892; }
    :root:not([data-theme="light"]) body[data-sec="stock"] { --accent: #a9c892; } :root:not([data-theme="light"]) body[data-sec="sales"] { --accent: #e2b055; }
    :root:not([data-theme="light"]) body[data-sec="mats"] { --accent: #7cc0ae; } :root:not([data-theme="light"]) body[data-sec="assets"] { --accent: #d1a07c; }
    :root:not([data-theme="light"]) body[data-sec="expenses"] { --accent: #e58a72; }
    :root:not([data-theme="light"]) .hometile[data-sec="summary"] { --tc: #a9c892; } :root:not([data-theme="light"]) .hometile[data-sec="stock"] { --tc: #a9c892; }
    :root:not([data-theme="light"]) .hometile[data-sec="sales"] { --tc: #e2b055; } :root:not([data-theme="light"]) .hometile[data-sec="mats"] { --tc: #7cc0ae; }
    :root:not([data-theme="light"]) .hometile[data-sec="assets"] { --tc: #d1a07c; } :root:not([data-theme="light"]) .hometile[data-sec="expenses"] { --tc: #e58a72; }
  }

  .brand { flex-direction: column; text-align: center; gap: 2px; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 14px; }
  .brand svg { width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 2px 10px rgba(61,90,58,.25); }
  .brand h1 { font-size: 38px; color: var(--accent); margin-top: 6px; }
  .brand .lat { font-size: 12px; letter-spacing: .32em; color: var(--earth); font-weight: 700; direction: ltr; }

  .homegrid { gap: 12px; }
  .hometile { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-inline-start: 6px solid var(--tc); border-radius: 18px; min-height: 124px; padding: 14px; box-shadow: 0 1px 2px rgba(60,50,20,.06); }

  .hometile .ic svg { width: 26px; height: 26px; stroke: var(--tc); }
  .hometile b { font-size: 20px; } .hometile .tv { color: var(--muted); font-size: 14px; opacity: 1; }
  .secbar { border-radius: 16px; }

  /* ---- option B: big capital + quiet tiles ---- */
  .brand { flex-direction: row; text-align: start; gap: 12px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; }
  .brand svg { width: 46px; height: 46px; box-shadow: none; }

    var lowBox = h("div", { class: "lowline", hidden: "" });
    var tCost = h("span", { class: "val" }), tVal = h("span", { class: "val" }), tQty = h("span", { class: "val" }), tProfit = h("span", { class: "val" });
    v.appendChild(h("div", { class: "card" }, h("h2", { text: "المخزون" }),
      S.items.length ? h("div", {}, line("قيمة المخزون (تكلفة)", tCost), line("قيمته بسعر البيع", tVal), line("عدد الحبات", tQty), line("الربح المتوقع", tProfit)) : emptyJar(),
      S.items.length ? line("نبّهني لما الكمية ≤", numInput(S.low, function (n) { S.low = Math.floor(n); touch(); }, "5", "حد التنبيه")) : null,
      lowBox,
      S.items.length ? h("p", { class: "note", text: "الهامش % = (سعر البيع − التكلفة) ÷ سعر البيع." }) : null
    ));
    var cards = [];

      var n = S.items.filter(function (x) { return x.qty <= S.low; }).length;
      lowBox.hidden = !n; lowBox.textContent = n ? "⚠ " + n + " " + (n === 1 ? "صنف" : "أصناف") + " قارب يخلص" : "";
    });
    S.items.forEach(function (it) { var el = itemCard(it); cards.push({ it: it, el: el }); v.appendChild(el); });
  }

  function emptyJar() {

  }
  function itemCard(it) {

      h("div", { class: "row2" },
        field("تكلفة الحبة (د)", numInput(it.cost, function (n) { it.cost = n; touch(); }, "0.00", "تكلفة الحبة")),
        field("سعر البيع (د)", numInput(it.price, function (n) { it.price = n; touch(); }, "0.00", "سعر البيع"))),
      h("div", { class: "field" }, h("label", { text: "الكمية" }), h("div", { class: "stepper" }, minus, qtyInp, plus)),

  }

  // ---------- assets / expenses
  function renderList(v, kind, cfg) {

    var tot = h("span", { class: "val" });

      ));
    });

    live.push(function () { tot.textContent = money(S[kind].reduce(function (a, x) { return a + x[cfg.valueKey]; }, 0)); });
  }

  // ---------- summary + calculator + backup
  var pendingImport = null;
  function renderSummary(v) {
    var t = totals(), ss = salesStats(), exps = S.expenses.filter(function (x) { return x.amount > 0; }).slice().sort(function (a, b) { return b.amount - a.amount; });
    var exTotal = exps.reduce(function (a, x) { return a + x.amount; }, 0), net = ss.month.profit - exTotal;
    var vd = h("div", { class: "verdict neutral" }), vt = h("b"), vs = h("span");
    if (!ss.month.rev && !exTotal) { vt.textContent = "ما في بيانات للشهر بعد"; vs.textContent = "سجّل مبيعاتك ومصاريفك وبيطلع هون إذا ربحان أو خسران."; }
    else { vd.className = "verdict " + (net >= 0 ? "win" : "lose"); vt.textContent = (net >= 0 ? "ربحان " : "خسران ") + money(Math.abs(net)) + " هالشهر"; vs.textContent = "ربح المبيعات " + money(ss.month.profit) + " − المصاريف " + money(exTotal); }
    vd.append(vt, vs); v.appendChild(vd);

    var tot = t.capital || 1;
    function seg(w, bg) { return h("i", { style: "width:" + (w / tot * 100) + "%;background:" + bg }); }
    v.appendChild(h("div", { class: "card hero" }, h("span", { class: "lbl", text: "رأس المال الكلي" }), h("span", { class: "big", text: money(t.capital) }),
      h("div", { class: "split", "aria-hidden": "true" }, seg(t.stockCost, "#fff"), seg(t.mats, "rgba(255,255,255,.55)"), seg(t.assets, "var(--earth)"), seg(S.cash, "var(--gold)")),
      h("div", { class: "legend" }, h("span", { style: "--c:#fff", text: "مخزون " + money(t.stockCost) }), h("span", { style: "--c:rgba(255,255,255,.55)", text: "خامات " + money(t.mats) }), h("span", { style: "--c:var(--earth)", text: "أصول " + money(t.assets) }), h("span", { style: "--c:var(--gold)", text: "نقد " + money(S.cash) }))));

    var pr = Math.max(ss.month.profit, 0), cm = Math.max(pr, exTotal) || 1;
    function cmpRow(label, val, color) { return h("div", { class: "exrow" }, h("div", { class: "line" }, h("span", { text: label }), h("span", { class: "val", text: money(val) })), h("div", { class: "bar big" }, h("i", { style: "width:" + (val / cm * 100) + "%;background:" + color }))); }
    v.appendChild(h("div", { class: "card" }, h("h2", { text: "الربح مقابل المصروف (هالشهر)" }),
      cmpRow("ربح المبيعات", pr, "var(--good)"), cmpRow("المصاريف", exTotal, "var(--bad)"),
      line("الفرق", h("span", { class: "val " + (net < 0 ? "bad" : "good"), text: (net < 0 ? "-" : "+") + money(Math.abs(net)) }))));
    var days = [], DN = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    for (var di = 6; di >= 0; di--) { var ts = Date.now() - di * 86400000; days.push({ k: dayKey(ts), n: new Date(ts + 3 * 3600000).getUTCDay(), v: 0 }); }
    S.sales.forEach(function (x) { var k = dayKey(x.t); days.forEach(function (d) { if (d.k === k) d.v += x.price * x.qty; }); });
    var mx = Math.max.apply(null, days.map(function (d) { return d.v; })) || 1;
    var c7 = h("div", { class: "chart7" });
    days.forEach(function (d) { c7.appendChild(h("div", { class: "col" }, h("small", { text: d.v ? fmt(d.v, 0) : "" }), h("i", { style: "height:" + Math.max(d.v / mx * 100, 2) + "%" }), h("small", { text: DN[d.n].slice(0, 3) }))); });
    v.appendChild(h("div", { class: "card" }, h("h2", { text: "مبيعات آخر 7 أيام" }), c7));
    var byItem = {};
    S.sales.forEach(function (x) { var k = x.name || "بدون اسم"; byItem[k] = (byItem[k] || 0) + (x.price - x.cost) * x.qty; });
    var top5 = Object.keys(byItem).map(function (k) { return { n: k, p: byItem[k] }; }).sort(function (a, b) { return b.p - a.p; }).slice(0, 5);
    var pc = h("div", { class: "card" }, h("h2", { text: "أكثر الأصناف ربحاً" }));
    if (!top5.length) pc.appendChild(h("div", { class: "empty", text: "سجّل مبيعات وبتظهر هون." }));
    else { var pm = Math.max.apply(null, top5.map(function (x) { return Math.abs(x.p); })) || 1;
      top5.forEach(function (x) { pc.appendChild(h("div", { class: "exrow" }, h("div", { class: "line" }, h("span", { text: x.n }), h("span", { class: "val " + (x.p < 0 ? "bad" : "good"), text: money(x.p) })), h("div", { class: "bar" }, h("i", { style: "width:" + Math.abs(x.p) / pm * 100 + "%;background:" + (x.p < 0 ? "var(--bad)" : "var(--brand)") })))); }); }
    v.appendChild(pc);
    var card = h("div", { class: "card" }, h("h2", { text: "المصاريف الشهرية" }));
    if (!exps.length) card.appendChild(h("div", { class: "empty", text: "ضيف مصاريفك من قسم المصاريف." }));
    else {
      var top = exps[0], topPct = top.amount / exTotal * 100;
      if (exps.length > 1 && topPct >= 40) card.appendChild(h("div", { class: "lowline", text: "أكبر مصروف: " + top.name + " (" + fmt(topPct, 0) + "% من المصاريف). حاول تقلله." }));
      exps.forEach(function (x) {
        var pct = x.amount / exTotal * 100, hi = exps.length > 1 && pct >= 40;
        card.appendChild(h("div", { class: "exrow" },
          h("div", { class: "line" }, h("span", { text: x.name || "بدون اسم" }), h("span", { class: "val " + (hi ? "bad" : ""), text: money(x.amount) + " · " + fmt(pct, 0) + "%" })),
          h("div", { class: "bar" }, h("i", { style: "width:" + pct + "%;background:" + (hi ? "var(--bad)" : "var(--brand)") }))));
      });
      card.appendChild(line("المجموع", h("span", { class: "val", text: money(exTotal) })));
    }
    v.appendChild(card);
  }

  function renderAssetsExtras(v) {
    var cashBox = h("div", { class: "cashbox" }), cashVal;
    function drawCash(askPin) {
      cashBox.textContent = ""; cashVal = h("span", { class: "val", text: money(S.cash) });
      if (cashUnlocked) { cashBox.appendChild(numInput(S.cash, function (n) { S.cash = n; save(); }, "0", "النقد المتوفر")); return; }
      if (!askPin) {
        cashBox.appendChild(h("span", { class: "cashrow" }, cashVal, h("button", { class: "btn alt sm", type: "button", text: "تعديل", onclick: function () { drawCash(true); } })));
        return;
      }
      var pin = h("input", { type: "text", inputmode: "numeric", autocomplete: "off", placeholder: "الرمز", "aria-label": "رمز التعديل" });
      var ok = h("button", { class: "btn sm", type: "button", text: "تأكيد" });
      ok.addEventListener("click", function () { if (pin.value.trim() === "0000") { cashUnlocked = true; drawCash(); toast("انفتح التعديل"); } else { toast("الرمز غلط"); pin.value = ""; } });
      cashBox.appendChild(h("span", { class: "cashrow" }, pin, ok));
    }
    drawCash();
    v.appendChild(h("div", { class: "card" }, h("h2", { text: "النقد" }), line("نقد متوفر", cashBox, "التعديل على النقد لعبدالله شوكة فقط (برمز)")));

    var lastBk = h("p", { class: "note" }), pendBox = h("div", { class: "card", hidden: "" });
    lastBk.textContent = S.lastBackup ? "آخر نسخة: " + new Intl.DateTimeFormat("en-GB", { timeZone: TZ, dateStyle: "medium", timeStyle: "short" }).format(S.lastBackup) : "ما صدّرت نسخة لسا.";
    v.appendChild(h("div", { class: "card" },
      h("h2", { text: "النسخة الاحتياطية" }),
      h("p", { class: "sub", text: "بياناتك محفوظة على هالجهاز بس. صدّر نسخة من وقت لوقت، وخاصة قبل ما تمسح بيانات المتصفح أو تغيّر التلفون." }),
      lastBk,
      h("div", { class: "row2" }, h("button", { class: "btn alt", type: "button", text: "شارك الملخص", onclick: shareSummary }),
        h("button", { class: "btn alt", type: "button", text: "تصدير Excel", onclick: exportCsv })),
      h("div", { class: "row2" }, h("button", { class: "btn", type: "button", text: "تصدير نسخة", onclick: exportData }),
        h("button", { class: "btn alt", type: "button", text: "استيراد نسخة", onclick: function () { $("importFile").click(); } })),
      h("button", { class: "btn alt", type: "button", text: "فعّل تذكير الإشعارات", onclick: enableReminder }),
      h("p", { class: "note", text: "التذكير بالخلفية بيشتغل على أندرويد بعد تثبيت التطبيق. على الآيفون بيظهر التنبيه جوا التطبيق." }),
      pendBox
    ));
    if (!pendingImport) pendBox.hidden = true;
    else {
      pendBox.hidden = false; var p = pendingImport;
      pendBox.append(
        h("p", { text: "في الملف: " + p.items.length + " صنف، " + p.assets.length + " أصل، " + p.expenses.length + " مصروف. تستبدل بيانات هالجهاز فيها؟" }),
        h("div", { class: "row2" },
          h("button", { class: "btn danger", type: "button", text: "نعم، استبدل", onclick: function () { S = clean(p); pendingImport = null; save(); render(); toast("انسترجعت البيانات"); } }),
          h("button", { class: "btn alt", type: "button", text: "إلغاء", onclick: function () { pendingImport = null; render(); } })
        )
      );
    }
  }

  function summaryText() {
    var t = totals(), d = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, dateStyle: "medium" }).format(Date.now());
    var L = ["أرياف – ملخص " + d, "رأس المال: " + money(t.capital), "المخزون (تكلفة): " + money(t.stockCost), "الأصول: " + money(t.assets), "النقد: " + money(S.cash),
      "الربح المتوقع: " + money(t.profit), "المصاريف الشهرية: " + money(t.expenses), "", "الأصناف:"];
    S.items.forEach(function (it) { L.push("• " + it.name + " × " + it.qty); });
    return L.join("\n");
  }
  function shareSummary() {
    var txt = summaryText();
    if (navigator.share) { navigator.share({ text: txt }).catch(function () {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(function () { toast("اننسخ الملخص"); }, function () { toast("ما قدرت أنسخ"); }); return; }
    toast("المتصفح ما بدعم المشاركة");
  }
  function exportCsv() {
    var q = function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; };
    var rows = [["الصنف", "التكلفة", "سعر البيع", "الكمية", "الهامش %"].map(q).join(",")];
    S.items.forEach(function (it) { var m = marginPct(it); rows.push([q(it.name), it.cost, it.price, it.qty, m == null ? "" : m.toFixed(1)].join(",")); });
    var blob = new Blob(["\ufeff" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "aryaf-stock.csv"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000); toast("نزّلت ملف Excel");
  }

  function exportData() {
    S.lastBackup = Date.now(); save(); syncMeta();
    var d = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(Date.now());
    var name = "aryaf-backup-" + d + ".json";
    var payload = JSON.stringify({ app: "aryaf-inventory", version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2);
    var blob = new Blob([payload], { type: "application/json" });
    function download() {
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast("نزّلت النسخة");
    }
    try {
      var file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "نسخة أرياف" }).then(function () { toast("انحفظت النسخة"); }, function (e) { if (!e || e.name !== "AbortError") download(); });
        touch(); return;
      }
    } catch (e) {}
    download(); touch();
  }

  $("importFile").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0]; ev.target.value = "";
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) return toast("الملف كبير كثير");
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(String(r.result));
        var d = j && j.data ? j.data : j;
        if (!d || (!Array.isArray(d.items) && !Array.isArray(d.assets) && !Array.isArray(d.expenses))) throw new Error("shape");
        pendingImport = clean(d); tab = "assets"; render();
        window.scrollTo(0, document.body.scrollHeight);
      } catch (e) { toast("هالملف مش نسخة أرياف صحيحة"); }
    };
    r.onerror = function () { toast("ما قدرت أقرا الملف"); };
    r.readAsText(f);
  });

  // ---------- start
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  syncMeta();
  if ("serviceWorker" in navigator) {
    var hadCtl = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadCtl && !reloaded) { reloaded = true; location.reload(); } });
    window.addEventListener("load", function () { navigator.serviceWorker.register("service-worker.js").catch(function () {}); });
  }
})();
